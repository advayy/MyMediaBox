[package]
name = "mymediabox"
version = "1.0.0"
description = "MyMediaBox — a local-first TV and movie tracker"
authors = ["MyMediaBox contributors"]
edition = "2021"

[lib]
name = "mymediabox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde_json = "1"
